<!-- FORMULÁRIO DE NOVO PRODUTO -->
<div *ngIf="produtoAction?.event?.action === addProdutoAction">
  <form [formGroup]="addProductForm" (ngSubmit)="handleSubmitAddProduct()">
    <div class="card">
      <div class="p-fluid p-formgrid grid">
        <div class="field col-12 md:col-6">
          <label for="nome">Nome</label>
          <input
            pInputText
            id="nome"
            placeholder="Nome"
            formControlName="nome"
            [ngClass]="{
              'p-invalid':
                !addProductForm.get('nome')?.valid &&
                addProductForm.get('nome')?.touched
            }"
          />
        </div>
        <div class="field col-12 md:col-6" formGroupName="grupo">
          <label for="grupo">Grupo</label>
          <p-dropdown
            id="grupo"
            styleClass="w-full"
            [options]="grupos"
            placeholder="Selecione o Grupo"
            formControlName="id"
            optionLabel="nome"
            optionValue="id"
            (onChange)="onGroupChange($event.value)"
            [ngClass]="{
              'p-invalid':
                !addProductForm.get('grupo')?.valid &&
                addProductForm.get('grupo')?.touched
            }"
          ></p-dropdown>
        </div>
        <div class="field col-12 md:col-6">
          <label for="unidadeDeMedida">Unidade de Medida</label>
          <p-dropdown
            id="unidadeDeMedida"
            styleClass="w-full"
            [options]="unidadesDeMedida"
            placeholder="Selecione a Unidade"
            formControlName="unidadeDeMedida"
            optionLabel="label"
            optionValue="value"
            [ngClass]="{
              'p-invalid':
                !addProductForm.get('unidadeDeMedida')?.valid &&
                addProductForm.get('unidadeDeMedida')?.touched
            }"
          ></p-dropdown>
        </div>
        <div class="field col-12 md:col-6">
          <label for="preco">Preço</label>
          <input
            pInputText
            id="preco"
            placeholder="Preço"
            formControlName="preco"
            [ngClass]="{
              'p-invalid':
                addProductForm.get('preco')?.valid &&
                addProductForm.get('preco')?.touched
            }"
          />
        </div>
        <div class="field col-12 md:col-6">
          <label for="estoque">Estoque</label>
          <input
            pInputText
            id="estoque"
            placeholder="Estoque"
            formControlName="estoque"
            [ngClass]="{
              'p-invalid':
                !addProductForm.get('estoque')?.valid &&
                addProductForm.get('estoque')?.touched
            }"
          />
        </div>
        <div class="field col-12">
          <div class="field-checkbox">
            <p-checkbox formControlName="ativo" [binary]="true" inputId="ativoAdd"></p-checkbox>
            <label for="ativoAdd" class="ml-2">Ativo</label>
          </div>
        </div>
      </div>
      <div class="flex justify-content-center mt-4">
        <p-button type="submit" label="Concluir"></p-button>
      </div>
    </div>
  </form>
</div>
